name: Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dq_demo
          POSTGRES_PASSWORD: dq_demo_local_only
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dq_demo -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: shop
      POSTGRES_USER: dq_demo
      POSTGRES_PASSWORD: dq_demo_local_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run data quality suite
        run: >
          python -m pytest
          --html=reports/report.html
          --self-contained-html
          --junitxml=reports/junit.xml
      - name: Assemble GitHub Pages site
        run: |
          mkdir -p site
          cp reports/report.html site/report.html
          python scripts/build_pages_index.py reports/junit.xml site/index.html
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-quality-report
          path: |
            reports/report.html
            reports/junit.xml
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
