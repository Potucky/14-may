# Local PostgreSQL stand-in for warehouse-style data-quality checks.
# The password below is a local demo value, not a secret. Do not reuse it.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dq_demo
      POSTGRES_PASSWORD: dq_demo_local_only
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq_demo -d shop"]
      interval: 2s
      timeout: 5s
      retries: 20
